version: '3.8'
services:
  redis:
    image: redis
    ports:
      - "6doce379:6379"
    volumes:
      - probo_vol:/data

  backend:
    build: 
      context: .
      dockerfile: Dockerfile/Dockerfile.backend.prod
    environment:
      - REDIS_URL=redis
      - DATABASE_URL=postgresql://neondb_owner:npg_8YCpWMU1tgXA@ep-late-shadow-a4kynd14-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
    ports:
      - "3001:3001"
    depends_on:
      - redis

  orderworker:
    build: 
      context: .
      dockerfile: Dockerfile/workers/Dockerfile.orderworker
    environment:
      - REDIS_URL=redis
      - DATABASE_URL=postgresql://neondb_owner:npg_8YCpWMU1tgXA@ep-late-shadow-a4kynd14-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
    depends_on:
      - redis
  tradeworker:
    build: 
      context: .
      dockerfile: Dockerfile/workers/Dockerfile.tradesync
    environment:
      - REDIS_URL=redis
      - DATABASE_URL=postgresql://neondb_owner:npg_8YCpWMU1tgXA@ep-late-shadow-a4kynd14-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
    depends_on:
      - redis
  dbsync:
    build: 
      context: .
      dockerfile: Dockerfile/workers/Dockerfile.dbsync
    environment:
      - REDIS_URL=redis
      - DATABASE_URL=postgresql://neondb_owner:npg_8YCpWMU1tgXA@ep-late-shadow-a4kynd14-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
    depends_on:
      - redis
volumes:
   probo_vol: